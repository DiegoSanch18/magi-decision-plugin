[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magi-decision-plugin"
version = "1.0.0"
description = "Sistema multi-agente de toma de decisiones MAGI (MELCHIOR-1, BALTHAZAR-2, CASPER-3 + Mediador RITSUKO-0) para Google Antigravity."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "gspread>=6.0.0",
    "google-auth>=2.28.0",
    "google-api-python-client>=2.120.0",
    "mcp>=1.2.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
sdk = [
    "google-antigravity",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*", "engine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
